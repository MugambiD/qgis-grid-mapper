name: Build plugin zip

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: pip install pyflakes && python -m pyflakes grid_mapper
      - name: Package
        run: |
          VERSION=$(grep '^version=' grid_mapper/metadata.txt | cut -d= -f2)
          cp LICENSE grid_mapper/LICENSE
          zip -r "grid_mapper-${VERSION}.zip" grid_mapper -x '*__pycache__*' '*.pyc'
          echo "ZIP=grid_mapper-${VERSION}.zip" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: grid_mapper
          path: ${{ env.ZIP }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
