name: Build plugin release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: |
          python -m compileall -q grid_mapper
          python -m unittest discover -s grid_mapper/tests -v
      - name: Build QGIS plugin zip
        run: python scripts/build_release.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid-mapper-plugin
          path: dist/grid_mapper-*.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/grid_mapper-*.zip
